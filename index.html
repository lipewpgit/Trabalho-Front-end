<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover how data analytics can help your business grow.">
    <title>Componente de Card de Prévia de Estatísticas</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="stats-card" aria-labelledby="card-title">
      <div class="stats-card__content">
        <h1 id="card-title">Get <span>insights</span> that help your business grow.</h1>

        <p class="stats-card__description">
          Discover the benefits of data analytics and make better decisions regarding
          revenue, customer experience, and overall efficiency.
        </p>

        <dl class="stats">
          <div class="stats__item">
            <dt>companies</dt>
            <dd>10k+</dd>
          </div>
          <div class="stats__item">
            <dt>templates</dt>
            <dd>314</dd>
          </div>
          <div class="stats__item">
            <dt>queries</dt>
            <dd class="stats__uppercase">12m+</dd>
          </div>
        </dl>
      </div>

      <picture class="stats-card__image">
        <source media="(min-width: 800px)" srcset="images/pessoas-desktop.jpg" width="540" height="446">
        <img src="images/pessoas.jpg" alt="" width="654" height="480">
      </picture>
    </main>
  </body>
</html>
